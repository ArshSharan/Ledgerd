services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerd
      POSTGRES_PASSWORD: ledgerd
      POSTGRES_DB: ledgerd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerd -d ledgerd"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://ledgerd:ledgerd@postgres:5432/ledgerd?sslmode=disable"
      PORT: "8080"
      API_KEY: "test-api-key"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
